<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;background:#f6f8fc;font-family:Inter,Arial,sans-serif;color:#182230;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border:1px solid #e4e9f2;border-radius:12px;padding:32px;">
            <tr>
              <td>
                <p style="margin:0 0 24px;font-size:12px;letter-spacing:.14em;font-weight:700;color:#2f6fe0;">ÓRBITA</p>
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.3;color:#182230;">Confirme seu e-mail</h1>
                <p style="margin:0 0 24px;font-size:15px;line-height:1.6;color:#5a6578;">
                  Falta pouco para começar. Confirme que este e-mail é seu para ativar sua conta no ÓRBITA.
                </p>
                <p style="margin:0 0 24px;">
                  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/bem-vindo"
                     style="display:inline-block;background:#2f6fe0;color:#ffffff;text-decoration:none;font-weight:600;font-size:15px;padding:12px 20px;border-radius:8px;">
                    Confirmar meu e-mail
                  </a>
                </p>
                <p style="margin:0;font-size:13px;line-height:1.6;color:#677286;">
                  O link expira em 24 horas e só pode ser usado uma vez. Se você não criou uma conta, ignore esta mensagem.
                </p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0;font-size:12px;color:#677286;">ÓRBITA · alpha privado</p>
        </td>
      </tr>
    </table>
  </body>
</html>
